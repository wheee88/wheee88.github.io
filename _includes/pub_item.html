<li class="pub-item{% if include.pub.highlight %} first-author{% endif %}">{{ include.pub.authors }}, &ldquo;{{ include.pub.title }},&rdquo;{% if include.pub.venue and include.pub.venue != "" %} <em>{{ include.pub.venue }}</em>,{% endif %} {{ include.pub.date_label }}.{% if include.pub.highlight %} <span class="pub-badge">First author</span>{% endif %}<span class="pub-links">{% if include.pub.url %}<a href="{{ include.pub.url }}" target="_blank" rel="noopener">DOI</a>{% endif %}<button class="bibtex-btn" type="button" aria-label="Copy BibTeX" data-authors="{{ include.pub.authors | escape }}" data-title="{{ include.pub.title | escape }}" data-venue="{{ include.pub.venue | escape }}" data-year="{{ include.pub.year }}"{% if include.pub.month > 0 %} data-month="{{ include.pub.month }}"{% endif %}{% if include.pub.doi %} data-doi="{{ include.pub.doi }}"{% endif %}>BibTeX</button></span></li>
