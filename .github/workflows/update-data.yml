name: Update data & CV

on:
  schedule:
    # Every Monday 06:00 KST (Sunday 21:00 UTC)
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0
          pip install pyyaml weasyprint

      - name: Publications (OpenAlex + ORCID)
        id: pubs
        continue-on-error: true
        run: python3 scripts/update_publications.py

      - name: Patents (KIPRIS)
        id: patents
        continue-on-error: true
        env:
          KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY }}
        run: python3 scripts/fetch_patents.py

      - name: Funded projects (NTIS)
        id: projects
        continue-on-error: true
        env:
          NTIS_API_KEY: ${{ secrets.NTIS_API_KEY }}
        run: python3 scripts/fetch_projects.py

      - name: Build CV PDF
        id: cv
        continue-on-error: true
        run: python3 scripts/build_cv.py

      - name: Commit and push whatever succeeded
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml data/ cv.pdf
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: auto-update site data & CV"
            git push
          fi

      - name: Fail the run if any step failed
        if: steps.pubs.outcome == 'failure' || steps.patents.outcome == 'failure' || steps.projects.outcome == 'failure' || steps.cv.outcome == 'failure'
        run: |
          echo "pubs=${{ steps.pubs.outcome }} patents=${{ steps.patents.outcome }} projects=${{ steps.projects.outcome }} cv=${{ steps.cv.outcome }}"
          echo "A data source failed; its previous JSON was kept. See the step logs above."
          exit 1
