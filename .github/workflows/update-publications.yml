name: Update publications

on:
  schedule:
    # Every Monday 06:00 KST (Sunday 21:00 UTC)
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch new publications from OpenAlex
        run: python3 scripts/update_publications.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet _data/publications.yml; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git commit -m "chore: auto-update publication list from OpenAlex"
          git push
